name: ContinousIntegration

on:
  push:
    branches: [ "master" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Workloads
        run: dotnet workload restore

      - name: Begin Analysis
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin \
            /k:"3semestereksamen_3-semester-eksamens-projekt" \
            /o:"3semestereksamen" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.cobertura.xml"

      - name: Build
        run: dotnet build EksamenSemester3.sln --configuration Release

      - name: Test with Coverage
        run: |
          dotnet test EksamenSemester3.sln --configuration Release --no-build --verbosity normal \
            --collect:"XPlat Code Coverage"

      - name: End Analysis
        shell: powershell
        run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"